[package]
name = "quant"
version = "0.1.0"
description = "Quant desktop application"
authors = ["Quant"]
edition = "2021"

[lib]
name = "quant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
printpdf = "0.7.0"
tauri-plugin-dialog = "2"
sentry = { version = "0.48.3", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
